<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Web Design Lab — Offline Dashboard</title><style>
*{box-sizing:border-box}body{margin:0;padding:24px;font:16px/1.5 system-ui;background:#f2f5fa;color:#182235}main{max-width:1000px;margin:auto}h1{margin-bottom:4px}.note{color:#53627a;margin-top:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.card{background:white;border:1px solid #d8dfeb;border-radius:12px;padding:16px}.card h2{font-size:1.05rem;margin:0 0 12px}.card a{display:inline-block;background:#173b70;color:white;text-decoration:none;padding:8px 11px;border-radius:7px;font-weight:650}.num{font-size:.78rem;color:#536b92;font-weight:800;letter-spacing:.1em;margin-bottom:5px}</style></head><body><main><h1>Web Design Lab Practicals</h1><p class="note">Offline dashboard · Open a question's local folder to view its index.html. Internet is not required for files stored in this ZIP.</p><section class="grid" id="list"></section></main><script>
const q=[["01","Department Homepage"],["02","MTN Uganda Website"],["03","Makerere Exam Results"],["04","URA Portal"],["05","Serena Hotel Website"],["06","Chromelite Website"],["07","Survey Website"],["08","Tech Expo Website"],["09","Student Portal"],["10","Bank Website"]];
document.getElementById("list").innerHTML=q.map(([n,t])=>'<article class="card"><div class="num">QUESTION '+n+'</div><h2>'+t+'</h2><a href="Question-'+n+'/index.html">Open practical files</a></article>').join("");
</script></main></body></html>
